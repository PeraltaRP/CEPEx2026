<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulte os horários e as salas das apresentações de banner e dos trabalhos orais do VII CEPEx 2026.">
  <title>Ensalamento | VII CEPEx 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #101713;
      --surface: #19231d;
      --surface-light: #202c24;
      --gold: #d9b76e;
      --green: #91b69a;
      --text: #f3f1e9;
      --muted: #a5b0a6;
      --border: rgba(255, 255, 255, .12);
      --error: #ef9a91;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 80% 0, rgba(145, 182, 154, .12), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: 'Bricolage Grotesque', sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    .topbar {
      padding: 20px 6%;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      color: var(--gold);
      font-weight: 800;
      letter-spacing: 1px;
      text-decoration: none;
    }

    .back-link {
      color: var(--green);
      font-size: .92rem;
      text-decoration: none;
    }

    .back-link:hover,
    .logo:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    main {
      width: min(1120px, 90%);
      margin: 54px auto 80px;
    }

    .eyebrow {
      margin-bottom: 10px;
      color: var(--green);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      line-height: 1.1;
    }

    h1 span {
      color: var(--gold);
    }

    .intro {
      max-width: 700px;
      margin: 16px 0 32px;
      color: var(--muted);
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(200px, .8fr) minmax(180px, .7fr) minmax(280px, 1.5fr);
      gap: 18px;
      padding: 22px;
      margin-bottom: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: .9rem;
      font-weight: 600;
    }

    select,
    input {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: var(--surface-light);
      color: var(--text);
      font: inherit;
    }

    select:focus,
    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(217, 183, 110, .14);
    }

    .results-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .results-heading h2 {
      margin: 0;
      font-size: 1.4rem;
    }

    .count {
      color: var(--gold);
      font-size: .9rem;
      white-space: nowrap;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      min-width: 0;
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 13px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border: 1px solid rgba(217, 183, 110, .3);
      border-radius: 999px;
      color: var(--gold);
      font-size: .75rem;
      font-weight: 600;
    }

    .badge.room {
      border-color: rgba(145, 182, 154, .35);
      color: var(--green);
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 1.12rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .authors,
    .axis {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .axis {
      padding-top: 12px;
      margin-top: 12px;
      border-top: 1px solid var(--border);
      color: var(--green);
      font-size: .84rem;
    }

    .message {
      grid-column: 1 / -1;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--muted);
    }

    .message.error {
      border-color: rgba(239, 154, 145, .45);
      color: var(--error);
    }

    @media (max-width: 760px) {
      main {
        margin-top: 38px;
      }

      .filters,
      .cards {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 17px 5%;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">VII CEPEx 2026</a>
    <a class="back-link" href="index.html">← Voltar ao site</a>
  </header>

  <main>
    <p class="eyebrow">Ensino · Pesquisa · Extensão</p>
    <h1>Ensalamento <span>CEPEx</span></h1>
    <p class="intro">Consulte em qual sala e horário acontecem as apresentações de banner e os trabalhos orais. Use os filtros para encontrar uma sala ou trabalho.</p>

    <section class="filters" aria-label="Filtros do ensalamento">
      <div>
        <label for="category-filter">Modalidade</label>
        <select id="category-filter">
          <option value="todos">Todas as modalidades</option>
          <option value="artigosSimples">Apresentações de banner</option>
          <option value="trabalhosCompletos">Trabalhos orais</option>
        </select>
      </div>
      <div>
        <label for="room-filter">Sala</label>
        <select id="room-filter">
          <option value="todas">Todas as salas</option>
        </select>
      </div>
      <div>
        <label for="search-input">Buscar trabalho ou autor</label>
        <input id="search-input" type="search" placeholder="Digite o título ou nome do autor" autocomplete="off">
      </div>
    </section>

    <section aria-labelledby="results-title">
      <div class="results-heading">
        <h2 id="results-title">Apresentações</h2>
        <p class="count" id="results-count" aria-live="polite"></p>
      </div>
      <div class="cards" id="results-list" aria-live="polite">
        <p class="message">Carregando ensalamento…</p>
      </div>
    </section>
  </main>

  <script>
    const categories = {
      artigosSimples: 'Apresentação de banner',
      trabalhosCompletos: 'Trabalho oral'
    };

    const categoryFilter = document.querySelector('#category-filter');
    const roomFilter = document.querySelector('#room-filter');
    const searchInput = document.querySelector('#search-input');
    const resultsList = document.querySelector('#results-list');
    const resultsCount = document.querySelector('#results-count');
    let entries = [];

    function normalize(value) {
      return String(value ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLocaleLowerCase('pt-BR')
        .trim();
    }

    function createCard(entry) {
      const card = document.createElement('article');
      card.className = 'card';

      const badges = document.createElement('div');
      badges.className = 'badges';

      const category = document.createElement('span');
      category.className = 'badge';
      category.textContent = entry.category;

      const room = document.createElement('span');
      room.className = 'badge room';
      room.textContent = `Sala ${entry.room}`;

      const time = document.createElement('span');
      time.className = 'badge room';
      time.textContent = entry.time;
      badges.append(category, room, time);

      const title = document.createElement('h3');
      title.textContent = entry.title;

      const authors = document.createElement('p');
      authors.className = 'authors';
      authors.textContent = `Autores: ${entry.authors.join(', ')}`;

      card.append(badges, title, authors);

      if (entry.axis) {
        const axis = document.createElement('p');
        axis.className = 'axis';
        axis.textContent = entry.axis;
        card.append(axis);
      }

      return card;
    }

    function renderResults() {
      const selectedCategory = categoryFilter.value;
      const selectedRoom = roomFilter.value;
      const searchTerm = normalize(searchInput.value);
      const filtered = entries.filter((entry) => {
        const matchesCategory = selectedCategory === 'todos' || entry.key === selectedCategory;
        const matchesRoom = selectedRoom === 'todas' || entry.room === selectedRoom;
        const searchableText = normalize([entry.title, ...entry.authors, entry.axis, entry.room].join(' '));
        return matchesCategory && matchesRoom && searchableText.includes(searchTerm);
      });

      resultsCount.textContent = `${filtered.length} ${filtered.length === 1 ? 'apresentação' : 'apresentações'}`;
      resultsList.replaceChildren();

      if (filtered.length === 0) {
        const emptyMessage = document.createElement('p');
        emptyMessage.className = 'message';
        emptyMessage.textContent = 'Nenhuma apresentação encontrada. Tente outro termo ou filtro.';
        resultsList.append(emptyMessage);
        return;
      }

      filtered.forEach((entry) => resultsList.append(createCard(entry)));
    }

    function loadRooms() {
      const rooms = [...new Set(entries.map((entry) => entry.room))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
      rooms.forEach((roomName) => {
        const option = document.createElement('option');
        option.value = roomName;
        option.textContent = `Sala ${roomName}`;
        roomFilter.append(option);
      });
    }

    async function loadSchedule() {
      try {
        const response = await fetch('./Ensalamento.json');
        if (!response.ok) {
          throw new Error(`Não foi possível carregar o ensalamento (HTTP ${response.status}).`);
        }

        const data = await response.json();
        entries = Object.entries(categories).flatMap(([key, category]) => {
          const records = data[key];
          if (!Array.isArray(records)) {
            return [];
          }

          return records
            .filter((record) => record && typeof record.titulo === 'string' && Array.isArray(record.autores))
            .map((record) => ({
              key,
              category,
              room: String(record.sala ?? ''),
              time: String(record.horario ?? ''),
              title: record.titulo,
              authors: record.autores.map(String),
              axis: String(record.eixoTematico ?? '')
            }));
        }).sort((a, b) => {
          const timeOrder = a.time.localeCompare(b.time);
          return timeOrder || a.room.localeCompare(b.room, 'pt-BR');
        });

        loadRooms();
        renderResults();
      } catch (error) {
        resultsCount.textContent = '';
        resultsList.replaceChildren();
        const errorMessage = document.createElement('p');
        errorMessage.className = 'message error';
        errorMessage.textContent = error instanceof Error
          ? error.message
          : 'Ocorreu um erro ao carregar o ensalamento.';
        resultsList.append(errorMessage);
      }
    }

    categoryFilter.addEventListener('change', renderResults);
    roomFilter.addEventListener('change', renderResults);
    searchInput.addEventListener('input', renderResults);
    loadSchedule();
  </script>
</body>
</html>
